<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت پاکیزا</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f2;color:#292724;font-family:Tahoma,Arial,sans-serif}
header{background:#fff;padding:22px 16px;text-align:center;border-bottom:1px solid #eee}
header h1{margin:0;color:#52745c;font-size:25px}
header p{color:#777;font-size:13px}
main{max-width:850px;margin:22px auto;padding:0 14px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 14px #00000008}
h2{font-size:18px;margin-top:0}
input,button{font:inherit;border-radius:10px;padding:12px;width:100%;margin:6px 0}
input{border:1px solid #ddd;background:#fff}
button{border:0;background:#52745c;color:white;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#ecebe7;color:#333}
.danger{background:#a94343;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f5f5f1;padding:12px;border-radius:12px;text-align:center}
.stat strong{display:block;font-size:20px;color:#52745c;margin-top:8px}
.small{font-size:12px;color:#777;line-height:1.9}
.product{border:1px solid #eee;border-radius:12px;padding:13px;margin-top:10px}
.product img{width:72px;height:72px;object-fit:contain;float:left}
.product h3{margin:5px 0 10px;font-size:16px}
.actions{display:flex;gap:8px;clear:both;padding-top:8px}
.actions button{flex:1}
#message{padding:10px;border-radius:9px;display:none;margin-bottom:12px;line-height:1.8}
@media(max-width:420px){.grid{grid-template-columns:1fr}.stats{font-size:12px}.stat strong{font-size:16px}}
</style>
</head>
<body>
<header>
<h1>پاکیزا شاپ</h1>
<p>پنل مدیریت فروشنده</p>
</header>

<main>
<div id="message" role="status"></div>

<section class="card" id="loginCard">
<h2>ورود فروشنده</h2>
<p class="small">با ایمیل و رمز حسابی که قبلاً در Supabase ساخته‌ای وارد شو.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="ایمیل" autocomplete="username" required>
<input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" required>
<button id="loginButton" type="submit">ورود به پنل</button>
</form>
</section>

<div id="dashboard" hidden>
<section class="card">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
<h2>مدیریت محصولات</h2>
<button id="logoutButton" class="secondary" style="width:auto">خروج</button>
</div>
<div class="stats">
<div class="stat">تعداد محصولات<strong id="totalCount">۰</strong></div>
<div class="stat">موجودی کل<strong id="totalStock">۰</strong></div>
<div class="stat">ارزش خرید موجودی<strong id="totalValue">۰</strong></div>
</div>
</section>

<section class="card">
<h2 id="formTitle">افزودن محصول جدید</h2>
<form id="productForm">
<input id="productName" placeholder="نام محصول" required maxlength="150">
<div class="grid">
<input id="purchasePrice" type="number" min="0" step="any" placeholder="قیمت خرید (تومان)" required>
<input id="salePrice" type="number" min="0" step="any" placeholder="قیمت فروش (تومان)" required>
</div>
<input id="stock" type="number" min="0" step="1" placeholder="تعداد موجودی" required>
<input id="imageUrl" type="url" placeholder="لینک عکس محصول (اختیاری)">
<button id="saveButton" type="submit">ذخیره محصول</button>
<button id="cancelButton" type="button" class="secondary" hidden>لغو ویرایش</button>
</form>
<p class="small">قیمت‌ها را به تومان وارد کن. محصولات در دیتابیس ذخیره می‌شوند.</p>
</section>

<section class="card">
<h2>محصولات ثبت‌شده</h2>
<input id="search" placeholder="جست‌وجوی نام محصول">
<div id="productsList"></div>
</section>
</div>
</main>

<script>
const SUPABASE_URL ="https://ctwtxdkigempvenfhuhz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D-zDQpKXDR7Qz2k7itqQaQ_eGCEdOT1";

const messageBox = document.getElementById("message");
const loginCard = document.getElementById("loginCard");
const dashboard = document.getElementById("dashboard");
const productForm = document.getElementById("productForm");
const productsList = document.getElementById("productsList");

let db;
let products = [];
let editingId = null;
let busy = false;

function showMessage(text, error=false) {
  messageBox.textContent = text;
  messageBox.style.display = "block";
  messageBox.style.background = error ? "#fff0ef" : "#edf6ed";
  messageBox.style.color = error ? "#9a2929" : "#315c39";
}
function hideMessage() {
  messageBox.style.display = "none";
}
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function money(value) {
  return Number(value || 0).toLocaleString("fa-IR");
}
function setBusy(value) {
  busy = value;
  document.querySelectorAll("button").forEach(b => b.disabled = value);
}
function resetForm() {
  productForm.reset();
  editingId = null;
  document.getElementById("formTitle").textContent = "افزودن محصول جدید";
  document.getElementById("saveButton").textContent = "ذخیره محصول";
  document.getElementById("cancelButton").hidden = true;
}
function updateStats() {
  document.getElementById("totalCount").textContent = products.length.toLocaleString("fa-IR");
  document.getElementById("totalStock").textContent =
    products.reduce((sum,p)=>sum+Number(p.stock||0),0).toLocaleString("fa-IR");
  document.getElementById("totalValue").textContent =
    money(products.reduce((sum,p)=>sum+Number(p.purchase_price||0)*Number(p.stock||0),0));
}
function renderProducts() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(query));
  productsList.replaceChildren();

  if (!filtered.length) {
    productsList.textContent = query ? "محصولی با این نام پیدا نشد." : "هنوز محصولی ثبت نشده است.";
    updateStats();
    return;
  }

  filtered.forEach(p => {
    const div = document.createElement("div");
    div.className = "product";
    const safeImage = p.image_url &&
      /^https?:\/\//i.test(p.image_url) ? p.image_url : "";
    div.innerHTML = `
      ${safeImage ? `<img src="${escapeHTML(safeImage)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
      <h3>${escapeHTML(p.name)}</h3>
      <p class="small">قیمت خرید: ${money(p.purchase_price)} تومان</p>
      <p class="small">قیمت فروش: ${money(p.sale_price)} تومان</p>
      <p class="small">موجودی: ${money(p.stock)}</p>
      <div class="actions">
        <button type="button" class="secondary edit">ویرایش</button>
        <button type="button" class="danger delete">حذف</button>
      </div>`;
    div.querySelector(".edit").addEventListener("click", () => editProduct(p));
    div.querySelector(".delete").addEventListener("click", () => deleteProduct(p));
    productsList.appendChild(div);
  });
  updateStats();
}
async function loadProducts() {
  hideMessage();
  const {data,error} = await db.from("products")
    .select("*").order("created_at",{ascending:false});
  if(error) {
    showMessage("بارگذاری محصولات ناموفق بود: " + error.message, true);
    return;
  }
  products = data || [];
  renderProducts();
}
function editProduct(p) {
  editingId = p.id;
  document.getElementById("productName").value = p.name;
  document.getElementById("purchasePrice").value = p.purchase_price;
  document.getElementById("salePrice").value = p.sale_price;
  document.getElementById("stock").value = p.stock;
  document.getElementById("imageUrl").value = p.image_url || "";
  document.getElementById("formTitle").textContent = "ویرایش محصول";
  document.getElementById("saveButton").textContent = "ذخیره تغییرات";
  document.getElementById("cancelButton").hidden = false;
  productForm.scrollIntoView({behavior:"smooth",block:"start"});
}
async function deleteProduct(p) {
  if(!confirm("محصول «" + p.name + "» حذف شود؟")) return;
  setBusy(true);
  const {error} = await db.from("products").delete().eq("id",p.id);
  setBusy(false);
  if(error) {
    showMessage("حذف ناموفق بود: " + error.message,true);
    return;
  }
  showMessage("محصول حذف شد.");
  await loadProducts();
}
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(busy) return;
  hideMessage();
  setBusy(true);
  const {error} = await db.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  setBusy(false);
  if(error) showMessage("ورود انجام نشد. ایمیل و رمز را بررسی کن. ("+error.message+")",true);
});
document.getElementById("logoutButton").addEventListener("click", async () => {
  if(busy) return;
  setBusy(true);
  const {error} = await db.auth.signOut();
  setBusy(false);
  if(error) showMessage("خروج ناموفق بود: "+error.message,true);
});
document.getElementById("cancelButton").addEventListener("click",resetForm);
document.getElementById("search").addEventListener("input",renderProducts);

productForm.addEventListener("submit", async e => {
  e.preventDefault();
  if(busy) return;
  hideMessage();

  const name = document.getElementById("productName").value.trim();
  const purchase = Number(document.getElementById("purchasePrice").value);
  const sale = Number(document.getElementById("salePrice").value);
  const stockValue = Number(document.getElementById("stock").value);
  const image = document.getElementById("imageUrl").value.trim();

  if(!name || purchase<0 || sale<0 || !Number.isFinite(purchase) ||
     !Number.isFinite(sale) || !Number.isInteger(stockValue) || stockValue<0) {
    showMessage("لطفاً اطلاعات محصول و قیمت‌ها و موجودی را درست وارد کن.",true);
    return;
  }
  if(image && !/^https?:\/\//i.test(image)) {
    showMessage("لینک عکس باید با https:// یا http:// شروع شود.",true);
    return;
  }

  const item = {
    name,
    purchase_price:purchase,
    sale_price:sale,
    stock:stockValue,
    image_url:image || null
  };

  setBusy(true);
  const result = editingId
    ? await db.from("products").update(item).eq("id",editingId)
    : await db.from("products").insert(item);
  setBusy(false);

  if(result.error) {
    showMessage("ذخیره انجام نشد: "+result.error.message,true);
    return;
  }
  resetForm();
  showMessage("محصول با موفقیت ذخیره شد.");
  await loadProducts();
});

async function init() {
  if(SUPABASE_URL.includes("PASTE_") ||
     SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")) {
    showMessage("هنوز آدرس پروژه و Publishable key را در کد قرار نداده‌ای.",true);
    document.getElementById("loginButton").disabled = true;
    return;
  }
  try {
    db = window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const {data,error} = await db.auth.getSession();
    if(error) throw error;
    showApp(data.session);
    db.auth.onAuthStateChange((_event,session) => {
      showApp(session);
    });
  } catch(err) {
    showMessage("اتصال برقرار نشد. آدرس پروژه و کلید را بررسی کن.",true);
  }
}
function showApp(session) {
  loginCard.hidden = !!session;
  dashboard.hidden = !session;
  if(session) loadProducts();
  else {
    products = [];
    productsList.replaceChildren();
    updateStats();
    resetForm();
  }
}
init();
</script>
</body>
</html>
